stages:
  - lint
  - test

cache:
  paths:
    - node_modules/

lint:
  image: node:latest
  stage: lint
  script:
    - npm install
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  image: node:latest
  stage: test
  script:
    - npm install
    - npm test
  artifacts:
    paths:
      - reports/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
